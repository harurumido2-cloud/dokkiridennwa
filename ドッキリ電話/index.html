<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#ffffff">

<title>電話</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

.app {
  width: 100%;
  max-width: 500px;
  height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  background: white;
  padding-top: env(safe-area-inset-top);
}


/* =========================
   番号
========================= */

.number-area {
  height: 23%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0 25px 18px;
}

#number {
  width: 100%;
  min-height: 55px;
  text-align: center;
  font-size: clamp(34px, 9vw, 46px);
  font-weight: 300;
  letter-spacing: 1px;
  white-space: nowrap;
  overflow: hidden;
}


/* =========================
   キーパッド
========================= */

.keypad {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  column-gap: 10px;
  row-gap: 1px;
  padding: 0 36px 10px;
}

.key {
  width: min(76px, 18vw);
  height: min(76px, 18vw);
  margin: auto;
  border: none;
  border-radius: 50%;
  background: #e9e9e9;
  color: #111;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.key:active {
  transform: scale(.91);
  background: #d2d2d2;
}

.digit {
  font-size: 29px;
  line-height: 29px;
}

.letters {
  margin-top: 4px;
  font-size: 9px;
  line-height: 9px;
  font-weight: 600;
  letter-spacing: 1.7px;
}

.symbol {
  font-size: 27px;
}

.zero-plus {
  margin-top: 3px;
  font-size: 10px;
}

.delete-button {
  background: transparent;
  font-size: 25px;
}


/* =========================
   発信
========================= */

.call-button {
  background: #34c759;
}

.call-button:active {
  background: #28b64c;
}

.phone-icon {
  width: 36px;
  height: 36px;
  object-fit: contain;
  filter: brightness(0) invert(1);
}


/* =========================
   下部ナビ
========================= */

.bottom-nav {
  height: 78px;
  padding-bottom: env(safe-area-inset-bottom);
  border-top: 1px solid #e5e5e5;

  display: flex;
  flex-shrink: 0;
}

.nav-button {
  flex: 1;
  border: none;
  background: transparent;

  color: #8b8b8f;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  gap: 4px;
  font-size: 10px;
}

.nav-button.active {
  color: #0a84ff;
}

.nav-image {
  width: 26px;
  height: 26px;
  object-fit: contain;
}


/* =========================
   3×3ドット
========================= */

.keypad-icon {
  width: 26px;
  height: 26px;

  display: grid;
  grid-template-columns: repeat(3, 4px);
  grid-template-rows: repeat(3, 4px);
  gap: 3px;

  justify-content: center;
  align-content: center;
}

.keypad-icon span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
}


/* =========================
   通話画面
========================= */

.call-screen {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: none;
  flex-direction: column;
  align-items: center;

  background: white;

  padding:
    calc(55px + env(safe-area-inset-top))
    20px
    calc(20px + env(safe-area-inset-bottom));
}


/* 名前 */

.call-name {
  font-size: 27px;
  font-weight: 500;
  text-align: center;
}

.call-number {
  margin-top: 7px;
  font-size: 16px;
  color: #777;
}


/* =========================
   通話中キーパッド
========================= */

.call-keypad {
  width: 100%;
  max-width: 360px;

  margin-top: 35px;

  display: grid;

  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);

  gap: 5px;

  flex: 1;
}

.call-key {
  width: 62px;
  height: 62px;

  margin: auto;

  border: none;
  border-radius: 50%;

  background: #eeeeee;
  color: #111;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.call-key:active {
  transform: scale(.9);
  background: #d5d5d5;
}


/* =========================
   終了
========================= */

.hangup {
  width: 72px;
  height: 72px;

  flex-shrink: 0;

  border: none;
  border-radius: 50%;

  background: #ff3b30;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-top: 15px;
  margin-bottom: 5px;
}

.hangup:active {
  transform: scale(.9);
}

.hangup img {
  width: 35px;
  height: 35px;

  object-fit: contain;

  filter: brightness(0) invert(1);

  transform: rotate(135deg);
}


/* =========================
   小さい画面
========================= */

@media (max-height: 650px) {

  .number-area {
    height: 19%;
  }

  .key {
    width: 64px;
    height: 64px;
  }

  .bottom-nav {
    height: 65px;
  }

  .call-key {
    width: 56px;
    height: 56px;
  }
}

</style>
</head>


<body>

<div class="app">

  <!-- 番号 -->

  <div class="number-area">
    <div id="number"></div>
  </div>


  <!-- =========================
       メインキーパッド
  ========================== -->

  <main class="keypad">

    <button class="key" onclick="press('1')">
      <span class="digit">1</span>
    </button>

    <button class="key" onclick="press('2')">
      <span class="digit">2</span>
      <span class="letters">ABC</span>
    </button>

    <button class="key" onclick="press('3')">
      <span class="digit">3</span>
      <span class="letters">DEF</span>
    </button>

    <button class="key" onclick="press('4')">
      <span class="digit">4</span>
      <span class="letters">GHI</span>
    </button>

    <button class="key" onclick="press('5')">
      <span class="digit">5</span>
      <span class="letters">JKL</span>
    </button>

    <button class="key" onclick="press('6')">
      <span class="digit">6</span>
      <span class="letters">MNO</span>
    </button>

    <button class="key" onclick="press('7')">
      <span class="digit">7</span>
      <span class="letters">PQRS</span>
    </button>

    <button class="key" onclick="press('8')">
      <span class="digit">8</span>
      <span class="letters">TUV</span>
    </button>

    <button class="key" onclick="press('9')">
      <span class="digit">9</span>
      <span class="letters">WXYZ</span>
    </button>

    <button class="key" onclick="press('*')">
      <span class="symbol">*</span>
    </button>

    <button class="key" onclick="press('0')">
      <span class="digit">0</span>
      <span class="zero-plus">+</span>
    </button>

    <button class="key" onclick="press('#')">
      <span class="symbol">#</span>
    </button>

    <button
      class="key delete-button"
      onclick="deleteLast()">
      ⌫
    </button>

    <button
      class="key call-button"
      onclick="startCall()">

      <img
        src="Images/電話.png"
        class="phone-icon">

    </button>

    <div></div>

  </main>


  <!-- =========================
       下部
  ========================== -->

  <nav class="bottom-nav">

    <button class="nav-button">

      <img
        src="Images/通話.png"
        class="nav-image">

      <span>通話</span>

    </button>

    <button class="nav-button">

      <img
        src="Images/連絡先.png"
        class="nav-image">

      <span>連絡先</span>

    </button>

    <button class="nav-button active">

      <div class="keypad-icon">

        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>

      </div>

      <span>キーパッド</span>

    </button>

  </nav>

</div>


<!-- =========================
     通話画面
========================= -->

<section
  id="callScreen"
  class="call-screen">


  <div
    id="callName"
    class="call-name">

    接続中…

  </div>


  <div
    id="callNumber"
    class="call-number">
  </div>


  <!-- 応答待ち中からずっと表示 -->

  <div
    id="callKeypad"
    class="call-keypad">


    <button class="call-key" onclick="callKey('1')">
      <span class="digit">1</span>
    </button>

    <button class="call-key" onclick="callKey('2')">
      <span class="digit">2</span>
      <span class="letters">ABC</span>
    </button>

    <button class="call-key" onclick="callKey('3')">
      <span class="digit">3</span>
      <span class="letters">DEF</span>
    </button>

    <button class="call-key" onclick="callKey('4')">
      <span class="digit">4</span>
      <span class="letters">GHI</span>
    </button>

    <button class="call-key" onclick="callKey('5')">
      <span class="digit">5</span>
      <span class="letters">JKL</span>
    </button>

    <button class="call-key" onclick="callKey('6')">
      <span class="digit">6</span>
      <span class="letters">MNO</span>
    </button>

    <button class="call-key" onclick="callKey('7')">
      <span class="digit">7</span>
      <span class="letters">PQRS</span>
    </button>

    <button class="call-key" onclick="callKey('8')">
      <span class="digit">8</span>
      <span class="letters">TUV</span>
    </button>

    <button class="call-key" onclick="callKey('9')">
      <span class="digit">9</span>
      <span class="letters">WXYZ</span>
    </button>

    <button class="call-key" onclick="callKey('*')">
      <span class="symbol">*</span>
    </button>

    <button class="call-key" onclick="callKey('0')">
      <span class="digit">0</span>
      <span class="zero-plus">+</span>
    </button>

    <button class="call-key" onclick="callKey('#')">
      <span class="symbol">#</span>
    </button>

  </div>


  <!-- 終了 -->

  <button
    class="hangup"
    onclick="endCall()">

    <img
      src="Images/電話.png">

  </button>

</section>


<!-- =========================
     音声
========================= -->

<audio
  id="buttonSound"
  src="Sounds/ボタン.mp3"
  preload="auto">
</audio>

<audio
  id="ringSound"
  src="Sounds/呼び出し音.mp3"
  preload="auto">
</audio>


<script>

let currentNumber = "";
let connectionTimer = null;
let currentResponse = null;
let connected = false;


/* =========================
   要素
========================= */

const numberDisplay =
  document.getElementById("number");

const callScreen =
  document.getElementById("callScreen");

const callName =
  document.getElementById("callName");

const callNumber =
  document.getElementById("callNumber");

const callKeypad =
  document.getElementById("callKeypad");

const buttonSound =
  document.getElementById("buttonSound");

const ringSound =
  document.getElementById("ringSound");


/* =========================
   ボタン音
========================= */

function playButtonSound() {

  buttonSound.currentTime = 0;

  buttonSound.play()
    .catch(() => {});

}


/* =========================
   番号入力
========================= */

function press(value) {

  if (currentNumber.length >= 15) {
    return;
  }

  playButtonSound();

  currentNumber += value;

  numberDisplay.textContent =
    currentNumber;
}


/* =========================
   削除
========================= */

function deleteLast() {

  if (!currentNumber) {
    return;
  }

  playButtonSound();

  currentNumber =
    currentNumber.slice(0, -1);

  numberDisplay.textContent =
    currentNumber;
}


/* =========================
   Response読み込み
========================= */

function loadResponse(number) {

  return new Promise((resolve) => {

    const oldScript =
      document.getElementById(
        "responseScript"
      );

    if (oldScript) {
      oldScript.remove();
    }

    window.response = null;

    const script =
      document.createElement("script");

    script.id =
      "responseScript";

    script.src =
      "responses/" +
      encodeURIComponent(number) +
      ".js";

    script.onload = () => {

      currentResponse =
        window.response || null;

      resolve(currentResponse);

    };

    script.onerror = () => {

      currentResponse = null;

      resolve(null);

    };

    document.body.appendChild(script);

  });

}


/* =========================
   自動音声
========================= */

function speak(text) {

  if (!text) {
    return;
  }

  if (!("speechSynthesis" in window)) {
    return;
  }

  speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(text);

  voice.lang = "ja-JP";

  /*
   * 電話の自動音声っぽく
   */

  voice.rate = 0.9;
  voice.pitch = 1;
  voice.volume = 1;

  speechSynthesis.speak(voice);
}


/* =========================
   発信
========================= */

async function startCall() {

  if (!currentNumber) {
    return;
  }

  playButtonSound();

  const response =
    await loadResponse(currentNumber);


  /* 通話画面 */

  callScreen.style.display =
    "flex";


  callNumber.textContent =
    currentNumber;


  callName.textContent =
    response?.名前 ||
    "接続中…";


  /*
   * 応答待ち中から
   * キーパッドを表示
   */

  callKeypad.style.display =
    "grid";


  connected = false;


  /*
   * 2～9秒
   */

  const delay =
    Math.floor(
      Math.random() * 8000
    ) + 2000;


  /*
   * 呼び出し音
   */

  ringSound.currentTime = 0;

  ringSound.loop = true;

  ringSound.play()
    .catch(() => {});


  /*
   * 接続
   */

  connectionTimer =
    setTimeout(() => {

      /*
       * 呼び出し音を
       * 接続した瞬間に停止
       */

      ringSound.pause();

      ringSound.currentTime = 0;


      connected = true;


      callName.textContent =
        response?.名前 ||
        "接続しました";


      /*
       * 最初の自動音声
       *
       * 画面には文字を出さず
       * 音声だけ
       */

      const message =
        response?.最初の音声 ||
        "お問い合わせありがとうございます。";

      speak(message);

    }, delay);

}


/* =========================
   通話中キー
========================= */

function callKey(value) {

  if (!connected) {
    return;
  }

  playButtonSound();


  /*
   * 1～3
   */

  if (
    currentResponse &&
    ["1", "2", "3"].includes(value)
  ) {

    const key =
      "ボタン" + value;

    const message =
      currentResponse[key];

    if (message) {
      speak(message);
    }

  }

}


/* =========================
   通話終了
========================= */

function endCall() {

  if (connectionTimer) {

    clearTimeout(
      connectionTimer
    );

    connectionTimer = null;

  }


  ringSound.pause();

  ringSound.currentTime = 0;


  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }


  callScreen.style.display =
    "none";


  connected = false;

  currentResponse = null;

  currentNumber = "";

  numberDisplay.textContent =
    "";

}

</script>

</body>
</html>
