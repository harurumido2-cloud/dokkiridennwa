<!DOCTYPE html>
<html lang="ja">

<head>

  <!-- =========================
       Webアプリ・アイコン設定
  ========================== -->

  <link rel="apple-touch-icon" href="./Images/アイコン.jpg">
  <link rel="manifest" href="./manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ドッキリ電話">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">

  <meta name="theme-color" content="#ffffff">

  <title>電話</title>


  <style>

    /* =========================
       基本
    ========================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    button {
      font-family: inherit;
      -webkit-appearance: none;
    }


    /* =========================
       アプリ本体
    ========================== */

    .app {
      width: 100%;
      max-width: 500px;
      height: 100dvh;

      margin: auto;

      display: flex;
      flex-direction: column;

      background: white;

      padding-top:
        env(safe-area-inset-top);
    }


    /* =========================
       番号表示
    ========================== */

    .number-area {
      height: 23%;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding:
        0 25px 18px;
    }

    #number {
      width: 100%;
      min-height: 55px;

      text-align: center;

      font-size:
        clamp(34px, 9vw, 46px);

      font-weight: 300;

      letter-spacing: 1px;

      white-space: nowrap;
      overflow: hidden;

      color: #111;
    }


    /* =========================
       メインキーパッド
    ========================== */

    .keypad {
      flex: 1;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      grid-template-rows:
        repeat(5, 1fr);

      column-gap: 10px;
      row-gap: 1px;

      padding:
        0 36px 10px;
    }


    /* =========================
       数字ボタン
    ========================== */

    .key {
      width: min(76px, 18vw);
      height: min(76px, 18vw);

      margin: auto;

      border: none;
      border-radius: 50%;

      background: #e9e9e9;

      color: #111;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition:
        transform .08s ease,
        background .08s ease;
    }

    .key:active {
      transform: scale(.91);
      background: #d2d2d2;
    }

    .digit {
      font-size: 29px;
      line-height: 29px;
    }

    .letters {
      margin-top: 4px;

      font-size: 9px;
      line-height: 9px;

      font-weight: 600;

      letter-spacing: 1.7px;
    }

    .symbol {
      font-size: 27px;
    }

    .zero-plus {
      margin-top: 3px;
      font-size: 10px;
    }


    /* =========================
       削除
    ========================== */

    .delete-button {
      background: transparent;
      font-size: 25px;
    }

    .delete-button:active {
      background: #eeeeee;
    }


    /* =========================
       発信ボタン
    ========================== */

    .call-button {
      background: #34c759;
    }

    .call-button:active {
      background: #28b64c;
    }

    .phone-icon {
      width: 36px;
      height: 36px;

      object-fit: contain;

      filter:
        brightness(0)
        invert(1);
    }


    /* =========================
       下部ナビ
    ========================== */

    .bottom-nav {
      height: 78px;

      padding-bottom:
        env(safe-area-inset-bottom);

      border-top:
        1px solid #e5e5e5;

      display: flex;

      flex-shrink: 0;

      background: white;
    }

    .nav-button {
      flex: 1;

      border: none;

      background: transparent;

      color: #8b8b8f;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      gap: 4px;

      font-size: 10px;

      cursor: pointer;
    }

    .nav-button.active {
      color: #0a84ff;
    }

    .nav-image {
      width: 26px;
      height: 26px;

      object-fit: contain;
    }


    /* =========================
       キーパッド3×3アイコン
    ========================== */

    .keypad-icon {
      width: 26px;
      height: 26px;

      display: grid;

      grid-template-columns:
        repeat(3, 4px);

      grid-template-rows:
        repeat(3, 4px);

      gap: 3px;

      justify-content: center;
      align-content: center;
    }

    .keypad-icon span {
      width: 4px;
      height: 4px;

      border-radius: 50%;

      background:
        currentColor;
    }


    /* =========================
       通話画面
    ========================== */

    .call-screen {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      flex-direction: column;

      align-items: center;

      background: white;

      padding:
        calc(55px + env(safe-area-inset-top))
        20px
        calc(20px + env(safe-area-inset-bottom));
    }


    /* =========================
       通話相手
    ========================== */

    .call-name {
      font-size: 27px;

      font-weight: 500;

      text-align: center;

      color: #111;
    }

    .call-number {
      margin-top: 7px;

      font-size: 16px;

      color: #777;
    }


    /* =========================
       通話中キーパッド
    ========================== */

    .call-keypad {
      width: 100%;
      max-width: 360px;

      margin-top: 35px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      grid-template-rows:
        repeat(4, 1fr);

      gap: 5px;

      flex: 1;
    }

    .call-key {
      width: 62px;
      height: 62px;

      margin: auto;

      border: none;

      border-radius: 50%;

      background: #eeeeee;

      color: #111;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition:
        transform .08s ease,
        background .08s ease;
    }

    .call-key:active {
      transform: scale(.9);

      background: #d5d5d5;
    }


    /* =========================
       通話終了
    ========================== */

    .hangup {
      width: 72px;
      height: 72px;

      flex-shrink: 0;

      border: none;

      border-radius: 50%;

      background: #ff3b30;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-top: 15px;
      margin-bottom: 5px;

      cursor: pointer;
    }

    .hangup:active {
      transform: scale(.9);
    }

    .hangup img {
      width: 35px;
      height: 35px;

      object-fit: contain;

      filter:
        brightness(0)
        invert(1);

      transform:
        rotate(135deg);
    }


    /* =========================
       小さい画面
    ========================== */

    @media (max-height: 650px) {

      .number-area {
        height: 19%;
      }

      .key {
        width: 64px;
        height: 64px;
      }

      .bottom-nav {
        height: 65px;
      }

      .call-key {
        width: 56px;
        height: 56px;
      }
    }

  </style>

</head>


<body>


  <!-- =========================
       メイン画面
  ========================== -->

  <div class="app">


    <!-- 番号 -->

    <div class="number-area">

      <div id="number"></div>

    </div>


    <!-- =========================
         メインキーパッド
    ========================== -->

    <main class="keypad">


      <!-- 1 -->

      <button
        class="key"
        onclick="press('1')">

        <span class="digit">
          1
        </span>

      </button>


      <!-- 2 -->

      <button
        class="key"
        onclick="press('2')">

        <span class="digit">
          2
        </span>

        <span class="letters">
          ABC
        </span>

      </button>


      <!-- 3 -->

      <button
        class="key"
        onclick="press('3')">

        <span class="digit">
          3
        </span>

        <span class="letters">
          DEF
        </span>

      </button>


      <!-- 4 -->

      <button
        class="key"
        onclick="press('4')">

        <span class="digit">
          4
        </span>

        <span class="letters">
          GHI
        </span>

      </button>


      <!-- 5 -->

      <button
        class="key"
        onclick="press('5')">

        <span class="digit">
          5
        </span>

        <span class="letters">
          JKL
        </span>

      </button>


      <!-- 6 -->

      <button
        class="key"
        onclick="press('6')">

        <span class="digit">
          6
        </span>

        <span class="letters">
          MNO
        </span>

      </button>


      <!-- 7 -->

      <button
        class="key"
        onclick="press('7')">

        <span class="digit">
          7
        </span>

        <span class="letters">
          PQRS
        </span>

      </button>


      <!-- 8 -->

      <button
        class="key"
        onclick="press('8')">

        <span class="digit">
          8
        </span>

        <span class="letters">
          TUV
        </span>

      </button>


      <!-- 9 -->

      <button
        class="key"
        onclick="press('9')">

        <span class="digit">
          9
        </span>

        <span class="letters">
          WXYZ
        </span>

      </button>


      <!-- * -->

      <button
        class="key"
        onclick="press('*')">

        <span class="symbol">
          *
        </span>

      </button>


      <!-- 0 -->

      <button
        class="key"
        onclick="press('0')">

        <span class="digit">
          0
        </span>

        <span class="zero-plus">
          +
        </span>

      </button>


      <!-- # -->

      <button
        class="key"
        onclick="press('#')">

        <span class="symbol">
          #
        </span>

      </button>


      <!-- 削除 -->

      <button
        class="key delete-button"
        onclick="deleteLast()">

        ⌫

      </button>


      <!-- 発信 -->

      <button
        class="key call-button"
        onclick="startCall()">

        <img
          src="./Images/電話.png"
          class="phone-icon"
          alt="発信">

      </button>


      <!-- 空白 -->

      <div></div>


    </main>


    <!-- =========================
         下部ナビ
    ========================== -->

    <nav class="bottom-nav">


      <!-- 通話 -->

      <button
        class="nav-button">

        <img
          src="./Images/通話.png"
          class="nav-image"
          alt="通話">

        <span>
          通話
        </span>

      </button>


      <!-- 連絡先 -->

      <button
        class="nav-button">

        <img
          src="./Images/連絡先.png"
          class="nav-image"
          alt="連絡先">

        <span>
          連絡先
        </span>

      </button>


      <!-- キーパッド -->

      <button
        class="nav-button active">

        <div class="keypad-icon">

          <span></span>
          <span></span>
          <span></span>

          <span></span>
          <span></span>
          <span></span>

          <span></span>
          <span></span>
          <span></span>

        </div>

        <span>
          キーパッド
        </span>

      </button>


    </nav>

  </div>


  <!-- =========================
       通話画面
  ========================== -->

  <section
    id="callScreen"
    class="call-screen">


    <!-- 名前 -->

    <div
      id="callName"
      class="call-name">

      接続中…

    </div>


    <!-- 電話番号 -->

    <div
      id="callNumber"
      class="call-number">
    </div>


    <!-- =========================
         通話中キーパッド
         応答待ち中も表示
    ========================== -->

    <div
      id="callKeypad"
      class="call-keypad">


      <button
        class="call-key"
        onclick="callKey('1')">

        <span class="digit">
          1
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('2')">

        <span class="digit">
          2
        </span>

        <span class="letters">
          ABC
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('3')">

        <span class="digit">
          3
        </span>

        <span class="letters">
          DEF
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('4')">

        <span class="digit">
          4
        </span>

        <span class="letters">
          GHI
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('5')">

        <span class="digit">
          5
        </span>

        <span class="letters">
          JKL
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('6')">

        <span class="digit">
          6
        </span>

        <span class="letters">
          MNO
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('7')">

        <span class="digit">
          7
        </span>

        <span class="letters">
          PQRS
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('8')">

        <span class="digit">
          8
        </span>

        <span class="letters">
          TUV
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('9')">

        <span class="digit">
          9
        </span>

        <span class="letters">
          WXYZ
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('*')">

        <span class="symbol">
          *
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('0')">

        <span class="digit">
          0
        </span>

        <span class="zero-plus">
          +
        </span>

      </button>


      <button
        class="call-key"
        onclick="callKey('#')">

        <span class="symbol">
          #
        </span>

      </button>


    </div>


    <!-- =========================
         通話終了
    ========================== -->

    <button
      class="hangup"
      onclick="endCall()">

      <img
        src="./Images/電話.png"
        alt="通話終了">

    </button>


  </section>


  <!-- =========================
       音声
  ========================== -->

  <audio
    id="buttonSound"
    src="./Sounds/ボタン.mp3"
    preload="auto">
  </audio>

  <audio
    id="ringSound"
    src="./Sounds/呼び出し音.mp3"
    preload="auto">
  </audio>


  <!-- =========================
       JavaScript
  ========================== -->

  <script>

    let currentNumber = "";

    let connectionTimer = null;

    let currentResponse = null;

    let connected = false;


    /* =========================
       要素
    ========================== */

    const numberDisplay =
      document.getElementById("number");

    const callScreen =
      document.getElementById("callScreen");

    const callName =
      document.getElementById("callName");

    const callNumber =
      document.getElementById("callNumber");

    const callKeypad =
      document.getElementById("callKeypad");

    const buttonSound =
      document.getElementById("buttonSound");

    const ringSound =
      document.getElementById("ringSound");


    /* =========================
       ボタン音
    ========================== */

    function playButtonSound() {

      buttonSound.currentTime = 0;

      buttonSound
        .play()
        .catch(() => {});

    }


    /* =========================
       番号入力
    ========================== */

    function press(value) {

      if (currentNumber.length >= 15) {
        return;
      }

      playButtonSound();

      currentNumber += value;

      numberDisplay.textContent =
        currentNumber;

    }


    /* =========================
       削除
    ========================== */

    function deleteLast() {

      if (!currentNumber) {
        return;
      }

      playButtonSound();

      currentNumber =
        currentNumber.slice(0, -1);

      numberDisplay.textContent =
        currentNumber;

    }


    /* =========================
       Response JS読み込み
       
       例:
       responses/110.js
       responses/100.js
       ========================== */

    function loadResponse(number) {

      return new Promise((resolve) => {

        const oldScript =
          document.getElementById(
            "responseScript"
          );

        if (oldScript) {
          oldScript.remove();
        }


        window.response = null;


        const script =
          document.createElement("script");


        script.id =
          "responseScript";


        script.src =
          "responses/" +
          encodeURIComponent(number) +
          ".js";


        script.onload = () => {

          currentResponse =
            window.response || null;

          resolve(currentResponse);

        };


        script.onerror = () => {

          currentResponse = null;

          resolve(null);

        };


        document.body.appendChild(script);

      });

    }


    /* =========================
       自動音声
    ========================== */

    function speak(text) {

      if (!text) {
        return;
      }

      if (!("speechSynthesis" in window)) {
        return;
      }


      speechSynthesis.cancel();


      const voice =
        new SpeechSynthesisUtterance(text);


      voice.lang =
        "ja-JP";


      /*
       * 自動音声っぽい設定
       */

      voice.rate = 0.9;

      voice.pitch = 1;

      voice.volume = 1;


      speechSynthesis.speak(voice);

    }


    /* =========================
       発信
    ========================== */

    async function startCall() {

      if (!currentNumber) {
        return;
      }


      playButtonSound();


      const number =
        currentNumber;


      const response =
        await loadResponse(number);


      /* 通話画面 */

      callScreen.style.display =
        "flex";


      callNumber.textContent =
        number;


      callName.textContent =
        response?.名前 ||
        "接続中…";


      /*
       * 応答待ちでも
       * キーパッドを表示
       */

      callKeypad.style.display =
        "grid";


      connected = false;


      /*
       * 2～10秒程度待つ
       */

      const delay =
        Math.floor(
          Math.random() * 8000
        ) + 2000;


      /*
       * 呼び出し音
       */

      ringSound.currentTime = 0;

      ringSound.loop = true;


      ringSound
        .play()
        .catch(() => {});


      /*
       * 接続
       */

      connectionTimer =
        setTimeout(() => {


          ringSound.pause();

          ringSound.currentTime = 0;


          connected = true;


          callName.textContent =
            response?.名前 ||
            "接続しました";


          /*
           * 画面には字幕を表示せず、
           * 音声だけ流す
           */

          const message =
            response?.最初の音声 ||
            "お問い合わせありがとうございます。";


          speak(message);


        }, delay);

    }


    /* =========================
       通話中キーパッド
    ========================== */

    function callKey(value) {

      /*
       * 応答する前は
       * ボタンを押しても反応させない
       */

      if (!connected) {
        return;
      }


      playButtonSound();


      /*
       * 1～3に対応
       *
       * ボタン1
       * ボタン2
       * ボタン3
       */

      if (
        currentResponse &&
        ["1", "2", "3"].includes(value)
      ) {


        const key =
          "ボタン" + value;


        const message =
          currentResponse[key];


        if (message) {

          speak(message);

        }

      }

    }


    /* =========================
       通話終了
    ========================== */

    function endCall() {

      if (connectionTimer) {

        clearTimeout(
          connectionTimer
        );

        connectionTimer = null;

      }


      ringSound.pause();

      ringSound.currentTime = 0;


      if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

      }


      callScreen.style.display =
        "none";


      connected = false;

      currentResponse = null;

      currentNumber = "";


      numberDisplay.textContent =
        "";

    }

  </script>

</body>

</html>
